name: Apply verified Runethread v0.9.0 template migration

on:
  push:
    branches:
      - runethread/migrate-v0.9.0
    paths:
      - .github/workflows/migrate-v0.9.0.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'

      - name: Install immutable Runethread v0.9.0
        run: go install github.com/runethread/core/cmd/runethread@v0.9.0

      - name: Verify exact v0.8 source pin
        run: |
          test "$("$(go env GOPATH)/bin/runethread" trust version .)" = "v0.8.0"

      - name: Run supported v0.8 to v0.9 migration
        run: |
          "$(go env GOPATH)/bin/runethread" upgrade .

      - name: Require exact migration surface
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(printf '%s\n' \
            .github/workflows/validate.yml \
            .runethread/config.json \
            .runethread/lock.json \
            MEMORY_PROTOCOL.md \
            README.md | sort)"
          ACTUAL="$(git diff --name-only | sort)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "unexpected migration diff" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED" "$ACTUAL" >&2
            exit 1
          fi

      - name: Strictly validate migrated template
        run: |
          "$(go env GOPATH)/bin/runethread" index --check .
          "$(go env GOPATH)/bin/runethread" validate .

      - name: Commit verified non-workflow migration output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .runethread/config.json .runethread/lock.json MEMORY_PROTOCOL.md README.md
          EXPECTED="$(printf '%s\n' \
            .runethread/config.json \
            .runethread/lock.json \
            MEMORY_PROTOCOL.md \
            README.md | sort)"
          ACTUAL="$(git diff --cached --name-only | sort)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "unexpected staged migration surface" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED" "$ACTUAL" >&2
            exit 1
          fi
          if git diff --quiet -- .github/workflows/validate.yml; then
            echo "expected generated validate.yml to remain as the one deferred workflow-file change" >&2
            exit 1
          fi
          git commit -m "chore: apply verified v0.9 template migration"
          git push origin HEAD:runethread/migrate-v0.9.0
