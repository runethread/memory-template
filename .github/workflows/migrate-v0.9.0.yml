name: Export Runethread v0.9.0 template migration

on:
  push:
    branches:
      - runethread/migrate-v0.9.0

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'

      - name: Install immutable Runethread v0.9.0
        run: go install github.com/runethread/core/cmd/runethread@v0.9.0

      - name: Verify exact v0.8 source pin
        run: |
          test "$("$(go env GOPATH)/bin/runethread" trust version .)" = "v0.8.0"

      - name: Run supported v0.8 to v0.9 migration
        run: |
          "$(go env GOPATH)/bin/runethread" upgrade .

      - name: Require exact migration surface
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(printf '%s\n' \
            .github/workflows/validate.yml \
            .runethread/config.json \
            .runethread/lock.json \
            MEMORY_PROTOCOL.md \
            README.md | sort)"
          ACTUAL="$(git diff --name-only | sort)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "unexpected migration diff" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED" "$ACTUAL" >&2
            exit 1
          fi

      - name: Strictly validate migrated template
        run: |
          "$(go env GOPATH)/bin/runethread" index --check .
          "$(go env GOPATH)/bin/runethread" validate .

      - name: Export exact verified migration bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runethread-v0.9.0-template-migration
          path: |
            .github/workflows/validate.yml
            .runethread/config.json
            .runethread/lock.json
            MEMORY_PROTOCOL.md
            README.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
